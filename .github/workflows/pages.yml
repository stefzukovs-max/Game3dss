# Publishes the playable game to GitHub Pages.
#
# The game is static — no bundler, no build step, no server code — so this is a
# copy, not a build.
#
# ── one-time setup ──
# Repository Settings → Pages → Source: **GitHub Actions**.
#
# That switch cannot be flipped from here. `configure-pages` is asked to enable
# Pages itself, but creating a Pages site needs repository-admin rights and the
# workflow's GITHUB_TOKEN does not carry them however its permissions are
# declared — it fails with "Resource not accessible by integration". Once the
# source is set, `enablement` is a no-op and every push deploys on its own.
#
# Only the files the browser actually asks for are uploaded. The tooling
# (Playwright harnesses, the asset pipeline) is build-time only and would add
# weight to every visitor's site for no reason.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/favela-shooter-game-fn7x6v]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; a half-uploaded 40 MB asset set is a broken game
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the playable files
        run: |
          mkdir -p _site
          cp -r index.html styles.css src vendor assets CREDITS.md README.md _site/
          # tell Pages to serve the files verbatim rather than run Jekyll over them
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
